<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Worksheet 4 - Part 4</title>

    <script src="../../util/MV.js"></script>
    <script src="script.js"></script>
    <script id="wgsl" type="x-shader" src="shaders.wgsl"></script>

    <style>
        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <canvas id="webgpu" width="960" height="540">
        No HTML5 canvas.
    </canvas>

    <table>
        <tr>
            <td>Emitted radiance (L_e):</td>
            <td>
                <input type="range" id="Le" min="0" max="2" step="0.01" value="1">
            </td>
            <td id="Le_val"></td>
        </tr>

        <tr>
            <td>Ambient radiance (L_a):</td>
            <td>
                <input type="range" id="La" min="0" max="1" step="0.01" value="0.1">
            </td>
            <td id="La_val"></td>
        </tr>

        <tr>
            <td>Diffuse coefficient (k_d):</td>
            <td>
                <input type="range" id="kd" min="0" max="1" step="0.01" value="0.9">
            </td>
            <td id="kd_val"></td>
        </tr>

        <tr>
            <td>Specular coefficient (k_s):</td>
            <td>
                <input type="range" id="ks" min="0" max="1" step="0.01" value="1">
            </td>
            <td id="ks_val"></td>
        </tr>

        <tr>
            <td>Shininess (s):</td>
            <td>
                <input type="range" id="shin" min="1" max="1000" step="1" value="50">
            </td>
            <td id="shin_val"></td>
        </tr>
    </table>

    <div class="buttons">
        <button id="subdivide">subdivide</button>
        <button id="coarsen">coarsen</button>
        <button id="orbit">orbit on/off</button>
    </div>

</body>

</html>
